version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # The site is a pnpm project; Dependabot covers pnpm under "npm".
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    groups:
      # One PR a week for routine bumps; majors still come one at a time.
      minor-and-patch:
        update-types: ["minor", "patch"]
