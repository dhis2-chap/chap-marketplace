name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Validate registry YAML
        run: pnpm validate
      - name: Check image provenance, tags and licenses
        run: pnpm check-digests
        env:
          # gh attestation verify reads the attestations through the GitHub API.
          GH_TOKEN: ${{ github.token }}
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          # Open-PR ingestion at build time; fail-soft, but authenticated
          # requests avoid the runners' shared unauthenticated rate limit.
          GITHUB_TOKEN: ${{ github.token }}
