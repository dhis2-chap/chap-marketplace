schema_version: 2

id: chapkit_minimalist_example_py
service_id: chapkit-minimalist-example-py
display_name: Minimalist Example (Python)
kind: starter

# The author's own chapkit AssessedStatus, copied from the service — not a
# marketplace verdict. red = highly experimental prototype, not validated.
# For a starter that is the honest reading: it is scaffolding, and its
# LinearRegression is a placeholder for a real model.
assessed_status: red

summary: >-
  Scaffolding, not a forecasting model. The canonical Python starting point
  for chapkit model authors: a scikit-learn LinearRegression served as a
  chapkit ML service. Copy the repository and replace the regressor in
  scripts/train_model.py with the real model.

source:
  repository: https://github.com/chap-models/chapkit_minimalist_example_py
  image: ghcr.io/chap-models/chapkit_minimalist_example_py
  # Pure Python (scikit-learn) on the chapkit Python base. The base image is
  # multi-arch, but this service's publish workflow builds linux/amd64 only.
  runtime_image: ghcr.io/dhis2-chap/chapkit-py

attribution:
  author: Chap team
  organization: HISP Centre, University of Oslo

compatibility:
  period_types: [monthly]
  min_prediction_periods: 0
  max_prediction_periods: 100
  requires_geo: false

covariates:
  # The service declares no required covariates and refuses free-form extras.
  # Its scripts do read rainfall and mean_temperature when the columns are
  # present — a starter under-declaring its inputs is exactly the kind of
  # thing to fix when you copy it.
  required: []
  defaults: []
  allow_free_additional: false

channels:
  stable: 1.0.4
  latest: 1.0.4

versions:
  - version: 1.0.4
    commit: 9d201c12599d71f7737cd7a8228f7f424ec4e58f
    image_tag: sha-9d201c1
    image_digest: sha256:fb32d6709c3173d83e95715fecf0b96877247d911ca035ae32306a477e761101
    chapkit: ">=2.2.0,<3"
    status: verified
    # Pinned by the maintainers without the three-approval round (CLIM-1745).
    verified_by: []
    changelog: >-
      Builds on the chapkit-py base image pinned by digest in the Dockerfile, so the commit fixes the base image it was built on. No change to the model.
  - version: 1.0.3
    commit: cfa45633e2966ae2336297ec41b400c4db5c13fe
    image_tag: sha-cfa4563
    image_digest: sha256:e83f8caaf66bee7a4ef598a277ae6bcada3d9cabee3395e41fee370f77b3fddd
    chapkit: ">=2.2.0,<3"
    status: verified
    # Pinned by the maintainers without the three-approval round (security fix).
    verified_by: []
    changelog: >-
      Upgrades certifi to 2026.10.19, which drops trust in the compromised eMudhra intermediate CAs, and builds on the chapkit-py base with uv 0.13.4. No change to the model.
  - version: 1.0.2
    commit: 3824ad74ea5869513b7cbaabd5100317c2b757b7
    image_tag: sha-3824ad7
    image_digest: sha256:7145e6c289fb7ce6f5b0d1ae96989f3241ee8587f31787d4dd0c3d7bc1d8048d
    chapkit: ">=2.2.0,<3"
    status: verified
    # Pinned by the maintainers without the three-approval round.
    verified_by: []
    changelog: >-
      Metrics on /metrics now use the stable OpenTelemetry names (http_server_request_duration_seconds_*). Built on chapkit 2.2.0 and servicekit 3.0.0. No change to the model.
  - version: 1.0.1
    commit: 73557efb865fe9960e37bbbf4999624fa949e235
    image_tag: sha-73557ef
    image_digest: sha256:9b57b1b4d1fe05702c21f4efa01870e1560815e0a4bb7179cdfe2ed7a7d95d9b
    chapkit: ">=2.1.2,<3"
    status: verified
    # Verified by the merge gate. Part of the chapkit 2.0.0 seed import.
    verified_by: []
    changelog: >-
      Require chapkit 2.1.2, whose failure messages keep the R error line
      instead of trailing warnings, and which applies the model
      configurations chap-core sends.

configurations:
  monthly:
    description: >-
      The only configuration the starter exposes. Add your own options to
      the config class in main.py as you replace the model.
    config:
      prediction_periods: 3
